<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Gado - Sociedade DR</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CHAVES DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDgnDHu-dHCo5oZRo113M5jQ1kxwX9_1uE",
            authDomain: "sociedade-dr.firebaseapp.com",
            projectId: "sociedade-dr",
            storageBucket: "sociedade-dr.firebasestorage.app",
            messagingSenderId: "200039389906",
            appId: "1:200039389906:web:7e78b4389e99bfcb536b0b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const colLocais = collection(db, "locais_gado_dr");
        const colMovimentacoes = collection(db, "movimentacoes_gado_dr");

        let locais = [];
        let movimentacoes = [];

        // CARREGAR LOCAIS (PROPRIEDADES)
        onSnapshot(colLocais, (snapshot) => {
            locais = [];
            snapshot.forEach(d => locais.push({ id: d.id, nome: d.data().nome }));
            atualizarSelectsLocais();
            atualizarQuadroEstoque();
        });

        // CARREGAR MOVIMENTAÇÕES
        const qMov = query(colMovimentacoes, orderBy("data", "desc"));
        onSnapshot(qMov, (snapshot) => {
            movimentacoes = [];
            snapshot.forEach((documento) => {
                movimentacoes.push({ idDoc: documento.id, ...documento.data() });
            });
            atualizarTabelaHistorico();
            atualizarQuadroEstoque();
        });

        // CONTROLE DO FORMULÁRIO DINÂMICO
        window.mudarTipoMovimento = function() {
            const tipo = document.getElementById('tipo').value;
            const divOrigem = document.getElementById('div-origem');
            const divDestino = document.getElementById('div-destino');
            
            if (tipo === 'Compra' || tipo === 'Nascimento') {
                divOrigem.classList.add('hidden');
                divDestino.classList.remove('hidden');
            } else if (tipo === 'Venda' || tipo === 'Abate' || tipo === 'Morte') {
                divOrigem.classList.remove('hidden');
                divDestino.classList.add('hidden');
            } else if (tipo === 'Transferência') {
                divOrigem.classList.remove('hidden');
                divDestino.classList.remove('hidden');
            }
        };

        // CADASTRAR NOVA PROPRIEDADE / PASTO
        window.adicionarLocal = async function() {
            const novoLocal = prompt("Digite o nome da Propriedade / Pasto (Ex: Fazenda Primavera, Arrendamento Dinei):");
            if (novoLocal && novoLocal.trim() !== "") {
                try {
                    await addDoc(colLocais, { nome: novoLocal.trim() });
                    alert("Propriedade cadastrada com sucesso!");
                } catch (e) {
                    alert("Erro ao cadastrar propriedade.");
                }
            }
        };

        function atualizarSelectsLocais() {
            const selectOrigem = document.getElementById('origem');
            const selectDestino = document.getElementById('destino');
            
            const valorOrigem = selectOrigem.value;
            const valorDestino = selectDestino.value;

            selectOrigem.innerHTML = '<option value="">Selecione a Propriedade de Origem</option>';
            selectDestino.innerHTML = '<option value="">Selecione a Propriedade de Destino</option>';

            locais.sort((a,b) => a.nome.localeCompare(b.nome)).forEach(local => {
                selectOrigem.innerHTML += `<option value="${local.nome}">${local.nome}</option>`;
                selectDestino.innerHTML += `<option value="${local.nome}">${local.nome}</option>`;
            });

            if (valorOrigem) selectOrigem.value = valorOrigem;
            if (valorDestino) selectDestino.value = valorDestino;
        }

        // SALVAR CADASTRO DO LOTE / MOVIMENTAÇÃO
        document.getElementById('form-movimentacao').addEventListener('submit', async function(e) {
            e.preventDefault();

            const tipo = document.getElementById('tipo').value;
            const data = document.getElementById('data').value;
            const quantidade = parseInt(document.getElementById('quantidade').value) || 0;
            const categoria = document.getElementById('categoria').value;
            const origem = document.getElementById('origem').value;
            const destino = document.getElementById('destino').value;
            const nomeLote = document.getElementById('nome-lote').value.trim();

            if ((tipo === 'Venda' || tipo === 'Abate' || tipo === 'Morte' || tipo === 'Transferência') && !origem) {
                alert("Selecione de qual propriedade o gado está saindo (Origem)."); return;
            }
            if ((tipo === 'Compra' || tipo === 'Nascimento' || tipo === 'Transferência') && !destino) {
                alert("Selecione em qual propriedade o gado vai ficar (Destino)."); return;
            }
            if (tipo === 'Transferência' && origem === destino) {
                alert("A Origem e o Destino não podem ser a mesma propriedade."); return;
            }

            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Gravando...";

            try {
                await addDoc(colMovimentacoes, {
                    tipo, 
                    data, 
                    quantidade, 
                    categoria, 
                    origem: (tipo === 'Compra' || tipo === 'Nascimento') ? 'Externo' : origem,
                    destino: (tipo === 'Venda' || tipo === 'Abate' || tipo === 'Morte') ? 'Externo' : destino,
                    nomeLote: nomeLote || 'Sem identificação', 
                    criadoEm: new Date().toISOString()
                });
                
                document.getElementById('quantidade').value = '';
                document.getElementById('nome-lote').value = '';
                alert("Cadastro realizado com sucesso!");
            } catch (err) {
                alert("Erro ao salvar no banco de dados.");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Gravar Registro";
            }
        });

        // APAGAR REGISTRO
        window.apagarMovimentacao = async function(idDoc) {
            if(confirm("Deseja apagar este registro? O estoque será recalculado automaticamente.")) {
                try {
                    await deleteDoc(doc(db, "movimentacoes_gado_dr", idDoc));
                } catch(err) {
                    alert("Erro ao excluir.");
                }
            }
        };

        // GERA O QUADRO SÉRIO DE ESTOQUE
        function atualizarQuadroEstoque() {
            const saldos = {};
            let totalGeral = 0;
            let totalFemeas = 0;
            let totalMachos = 0;

            locais.forEach(l => saldos[l.nome] = {});

            movimentacoes.forEach(mov => {
                const cat = mov.categoria;
                const qtd = mov.quantidade;

                if (mov.tipo === 'Compra' || mov.tipo === 'Nascimento') {
                    if (!saldos[mov.destino]) saldos[mov.destino] = {};
                    saldos[mov.destino][cat] = (saldos[mov.destino][cat] || 0) + qtd;
                } 
                else if (mov.tipo === 'Venda' || mov.tipo === 'Abate' || mov.tipo === 'Morte') {
                    if (saldos[mov.origem]) {
                        saldos[mov.origem][cat] = (saldos[mov.origem][cat] || 0) - qtd;
                    }
                } 
                else if (mov.tipo === 'Transferência') {
                    if (saldos[mov.origem]) {
                        saldos[mov.origem][cat] = (saldos[mov.origem][cat] || 0) - qtd;
                    }
                    if (!saldos[mov.destino]) saldos[mov.destino] = {};
                    saldos[mov.destino][cat] = (saldos[mov.destino][cat] || 0) + qtd;
                }
            });

            const tbody = document.getElementById('tabela-estoque-corpo');
            tbody.innerHTML = '';

            for (const local in saldos) {
                const categoriasLocal = Object.keys(saldos[local]).filter(c => saldos[local][c] > 0);
                const spanLocal = categoriasLocal.length;
                let primeiraLinha = true;

                if (spanLocal === 0) continue;

                categoriasLocal.forEach(cat => {
                    const qtd = saldos[local][cat];
                    totalGeral += qtd;

                    const catLower = cat.toLowerCase();
                    if (catLower.includes('fêmea') || catLower.includes('vaca') || catLower.includes('novilha') || catLower.includes('matriz')) {
                        totalFemeas += qtd;
                    } else if (catLower.includes('macho') || catLower.includes('boi') || catLower.includes('touro') || catLower.includes('garrote') || catLower.includes('rufião')) {
                        totalMachos += qtd;
                    }

                    const tr = document.createElement('tr');
                    tr.className = "bg-white text-slate-800";

                    let tdLocal = '';
                    if (primeiraLinha) {
                        tdLocal = `<td class="border border-slate-400 p-2 text-center font-bold bg-slate-50 align-middle" rowspan="${spanLocal}">${local}</td>`;
                        primeiraLinha = false;
                    }

                    tr.innerHTML = `
                        <td class="border border-slate-400 p-2 font-medium">${cat}</td>
                        <td class="border border-slate-400 p-2 text-center font-bold">${qtd}</td>
                        ${tdLocal}
                    `;
                    tbody.appendChild(tr);
                });
            }

            if (totalGeral === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-slate-500 border border-slate-400">Estoque zerado ou propriedades vazias.</td></tr>';
            }

            document.getElementById('estoque-total').innerText = totalGeral;
            document.getElementById('total-cabecas').innerText = totalGeral;
            document.getElementById('total-femeas').innerText = totalFemeas;
            document.getElementById('total-machos').innerText = totalMachos;
            
            const hoje = new Date();
            document.getElementById('data-estoque').innerText = hoje.toLocaleDateString('pt-BR');
        }

        function atualizarTabelaHistorico() {
            const corpoTabela = document.getElementById('tabela-historico');
            corpoTabela.innerHTML = '';

            if (movimentacoes.length === 0) {
                corpoTabela.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-slate-400">Nenhum lote cadastrado ou movimentação realizada.</td></tr>';
                return;
            }

            movimentacoes.forEach(mov => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-300 bg-white hover:bg-slate-50 text-xs";
                
                const partesData = mov.data.split('-');
                const dataFormatada = `${partesData[2]}/${partesData[1]}/${partesData[0]}`;

                let trajeto = '';
                if(mov.tipo === 'Compra' || mov.tipo === 'Nascimento') trajeto = `Entrou em: <b>${mov.destino}</b>`;
                else if(mov.tipo === 'Venda' || mov.tipo === 'Abate' || mov.tipo === 'Morte') trajeto = `Saiu de: <b>${mov.origem}</b>`;
                else trajeto = `De: <b>${mov.origem}</b> ➔ Para: <b>${mov.destino}</b>`;

                tr.innerHTML = `
                    <td class="p-2 text-center font-mono">${dataFormatada}</td>
                    <td class="p-2 font-bold text-slate-700 uppercase">${mov.tipo}</td>
                    <td class="p-2 text-center font-bold">${mov.quantidade}</td>
                    <td class="p-2 text-slate-600">
                        <b>Lote:</b> ${mov.nomeLote} <br>
                        <b>Cat:</b> ${mov.categoria}<br>
                        <span class="text-[10px] text-slate-500 font-mono">${trajeto}</span>
                    </td>
                    <td class="p-2 text-center">
                        <button onclick="apagarMovimentacao('${mov.idDoc}')" title="Excluir" class="text-red-600 font-bold hover:underline text-[10px]">Excluir</button>
                    </td>
                `;
                corpoTabela.appendChild(tr);
            });
        }

        window.onload = () => {
            document.getElementById('data').valueAsDate = new Date();
            mudarTipoMovimento();
        };
    </script>
</head>
<body class="bg-slate-100 min-h-screen p-2 md:p-6 font-sans">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- CABEÇALHO -->
        <div class="bg-slate-900 rounded shadow p-4 text-white flex justify-between items-center border-b-4 border-slate-600">
            <div>
                <h1 class="text-xl md:text-2xl font-bold uppercase tracking-widest">Controle de Estoque</h1>
                <p class="text-slate-400 text-xs tracking-wider">SOCIEDADE DR - PECUÁRIA</p>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-slate-400 uppercase tracking-widest mb-1">Total de Cabeças</p>
                <p class="text-3xl font-black leading-none"><span id="total-cabecas">0</span></p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- QUADRO DE ESTOQUE (ESTILO RELATÓRIO) -->
            <div>
                <div class="flex justify-between items-end mb-2">
                    <h2 class="text-sm font-bold text-slate-800 uppercase">Posição de Estoque</h2>
                    <button onclick="adicionarLocal()" class="text-xs font-bold text-slate-600 hover:text-slate-900 underline bg-slate-200 px-2 py-1 rounded">
                        + Cadastrar Propriedade
                    </button>
                </div>
                
                <div class="rounded shadow border-2 border-slate-700 overflow-hidden bg-white">
                    <div class="bg-slate-700 text-white flex justify-between px-4 py-2 font-bold text-sm tracking-wider">
                        <span>ESTOQUE</span>
                        <span id="data-estoque">--/--/----</span>
                    </div>
                    <table class="w-full text-sm border-collapse">
                        <thead class="bg-slate-300 text-slate-800 uppercase text-xs">
                            <tr>
                                <th class="border border-slate-400 p-2 text-left w-5/12">Categorias</th>
                                <th class="border border-slate-400 p-2 text-center w-2/12">Saldo</th>
                                <th class="border border-slate-400 p-2 text-center w-5/12">Local</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-estoque-corpo">
                            <tr><td colspan="3" class="p-4 text-center text-slate-400">Carregando...</td></tr>
                        </tbody>
                        <tfoot class="bg-slate-200 font-bold text-slate-900 text-sm">
                            <tr>
                                <td class="border border-slate-400 p-2 text-center uppercase">Total</td>
                                <td class="border border-slate-400 p-2 text-center" id="estoque-total">0</td>
                                <td class="border border-slate-400 p-2"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>

                <!-- RESUMO MACHOS/FÊMEAS -->
                <div class="w-full md:w-3/5 mt-4">
                    <table class="w-full text-sm border-collapse border-2 border-slate-700 shadow-sm bg-white">
                        <tbody>
                            <tr class="text-slate-800 font-semibold border-b border-slate-400">
                                <td class="border-r border-slate-400 p-2 text-center bg-slate-100">Fêmeas</td>
                                <td class="p-2 text-center w-24 font-bold" id="total-femeas">0</td>
                            </tr>
                            <tr class="text-slate-800 font-semibold">
                                <td class="border-r border-slate-400 p-2 text-center bg-slate-100">Machos</td>
                                <td class="p-2 text-center w-24 font-bold" id="total-machos">0</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- FORMULÁRIO DE CADASTRO DE LOTE E HISTÓRICO -->
            <div class="space-y-6">
                
                <div class="bg-white rounded border border-slate-300 shadow p-4">
                    <h2 class="text-sm font-bold text-slate-800 uppercase border-b border-slate-200 pb-2 mb-3">Cadastrar Lote / Movimentação</h2>
                    
                    <form id="form-movimentacao" class="space-y-3">
                        <div class="grid grid-cols-2 gap-3">
                            <div class="col-span-2">
                                <label class="block text-xs font-bold text-slate-600 uppercase">Operação</label>
                                <select id="tipo" onchange="mudarTipoMovimento()" class="w-full mt-1 p-2 border border-slate-400 rounded text-sm bg-slate-50 font-bold text-slate-800">
                                    <option value="Compra">Entrada (Compra de Lote)</option>
                                    <option value="Nascimento">Entrada (Nascimento)</option>
                                    <option value="Transferência">Transferência de Propriedade</option>
                                    <option value="Venda">Saída (Venda)</option>
                                    <option value="Abate">Saída (Abate)</option>
                                    <option value="Morte">Saída (Morte)</option>
                                </select>
                            </div>
                            
                            <div class="col-span-2">
                                <label class="block text-xs font-bold text-slate-600 uppercase">Identificação / Nome do Lote</label>
                                <input type="text" id="nome-lote" class="w-full mt-1 p-2 border border-slate-400 rounded text-sm" placeholder="Ex: Lote 01, Bezerrada Nelore, Fornecedor X">
                            </div>

                            <div class="col-span-2">
                                <label class="block text-xs font-bold text-slate-600 uppercase">Categoria dos Animais</label>
                                <select id="categoria" class="w-full mt-1 p-2 border border-slate-400 rounded text-sm bg-white">
                                    <option value="Bezerro Macho">Bezerro Macho</option>
                                    <option value="Bezerro Fêmea">Bezerro Fêmea</option>
                                    <option value="Macho 13 a 24 Meses">Macho 13 a 24 Meses</option>
                                    <option value="Fêmea 13 a 24 Meses">Fêmea 13 a 24 Meses</option>
                                    <option value="Boi Magro (> 24m)">Boi Magro (> 24m)</option>
                                    <option value="Boi Gordo (> 24m)">Boi Gordo (> 24m)</option>
                                    <option value="Novilha">Novilha</option>
                                    <option value="Vaca Matriz">Vaca Matriz</option>
                                    <option value="Touro / Rufião">Touro / Rufião</option>
                                </select>
                            </div>
                            
                            <div>
                                <label class="block text-xs font-bold text-slate-600 uppercase">Data</label>
                                <input type="date" id="data" required class="w-full mt-1 p-2 border border-slate-400 rounded text-sm">
                            </div>
                            
                            <div>
                                <label class="block text-xs font-bold text-slate-600 uppercase">Quantidade</label>
                                <input type="number" id="quantidade" min="1" required class="w-full mt-1 p-2 border border-slate-400 rounded text-sm font-bold" placeholder="0">
                            </div>

                            <div id="div-origem" class="hidden col-span-2">
                                <label class="block text-xs font-bold text-slate-600 uppercase text-red-700">Origem (Saiu de qual propriedade?)</label>
                                <select id="origem" class="w-full mt-1 p-2 border border-red-400 rounded text-sm bg-white"></select>
                            </div>

                            <div id="div-destino" class="col-span-2">
                                <label class="block text-xs font-bold text-slate-600 uppercase text-emerald-700">Destino (Onde este lote vai ficar?)</label>
                                <select id="destino" class="w-full mt-1 p-2 border border-emerald-400 rounded text-sm bg-white"></select>
                            </div>
                        </div>

                        <button type="submit" id="btn-submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded text-sm uppercase tracking-wide mt-2 transition">
                            Gravar Registro
                        </button>
                    </form>
                </div>

                <div class="bg-white rounded border border-slate-300 shadow overflow-hidden">
                    <h2 class="text-sm font-bold text-slate-800 uppercase p-3 bg-slate-100 border-b border-slate-300">Histórico de Lotes</h2>
                    <div class="h-64 overflow-y-auto">
                        <table class="w-full text-left border-collapse">
                            <tbody id="tabela-historico">
                                <!-- Preenchido via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
